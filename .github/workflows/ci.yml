name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build-test-publish:
    runs-on: windows-latest
    env:
      ARTIFACT_BASENAME: EpisodeRenamer-${{ github.ref_name }}-win-x86
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EpisodeRenamer-WPF.sln

      - name: Build
        run: dotnet build EpisodeRenamer-WPF.sln -c Release --no-restore

      - name: Test
        run: dotnet test EpisodeRenamer-WPF.sln -c Release --no-build

      - name: Publish win-x86 self-contained single-file
        run: dotnet publish src/EpisodeRenamer.App/EpisodeRenamer.App.csproj -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -o publish-x86

      - name: Zip publish output
        shell: pwsh
        run: |
          if (Test-Path publish-x86/EpisodeRenamer.App.exe) {
            Compress-Archive -Path publish-x86/* -DestinationPath "$env:ARTIFACT_BASENAME.zip"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: |
            publish-x86/
            ${{ env.ARTIFACT_BASENAME }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-publish
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ARTIFACT_BASENAME: EpisodeRenamer-${{ github.ref_name }}-win-x86
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**
          generate_release_notes: true